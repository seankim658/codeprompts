name: Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Release - ${{ matrix.platform.release_for }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - release_for: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - release_for: macOS-ARM
            os: macos-latest
            target: aarch64-apple-darwin
          - release_for: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build CLI
        run: cargo build --verbose --release --target ${{ matrix.platform.target }} -p codeprompt

      - name: Build TUI
        run: cargo build --verbose --release --target ${{ matrix.platform.target }} -p codeprompt-tui

      - name: Prepare Assets
        shell: bash
        run: |
          cd target/${{ matrix.platform.target }}/release
          ext="${{ matrix.platform.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}"

          mv "codeprompt${ext}"     "codeprompt-${{ matrix.platform.release_for }}${ext}"
          mv "codeprompt-tui${ext}" "codeprompt-tui-${{ matrix.platform.release_for }}${ext}"

          # sha256sum on Linux, shasum elsewhere
          if command -v sha256sum >/dev/null; then checksum="sha256sum"; else checksum="shasum -a 256"; fi
          $checksum "codeprompt-${{ matrix.platform.release_for }}${ext}"     > "codeprompt-${{ matrix.platform.release_for }}.sha256"
          $checksum "codeprompt-tui-${{ matrix.platform.release_for }}${ext}" > "codeprompt-tui-${{ matrix.platform.release_for }}.sha256"

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.platform.target }}/release/codeprompt-${{ matrix.platform.release_for }}*
            target/${{ matrix.platform.target }}/release/codeprompt-tui-${{ matrix.platform.release_for }}*

  upload-templates:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compress templates directory
        run: zip -r templates.zip cli/src/templates
      - name: Upload templates
        uses: softprops/action-gh-release@v2
        with:
          files: templates.zip
